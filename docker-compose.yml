services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-flavourgraph}
    volumes:
      - ./neo4j/data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-flavourgraph}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-flavourgraph}
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      neo4j:
        condition: service_healthy
