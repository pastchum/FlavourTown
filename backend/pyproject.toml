[project]
name = "flavour-graph"
version = "0.1.0"
description = "Flavour knowledge graph: ingestion, similarity and API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
flavour-ingest = "flavour_graph.ingest.run:main"
flavour-similarity = "flavour_graph.similarity.job:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flavour_graph*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["UP045"]  # keep Optional[...] while Python 3.9 is supported
